name: Build unstable

on:
  push:
  workflow_dispatch:
    inputs:
      custom_tag:
        type: string
        description: Docker image tag
        required: true
        default: "latest-develop"

concurrency:
  group: gradle
# cancel-in-progress: true  # keep runs queued; a manual workflow_dispatch and the push run
                            # share this group and must not cancel each other


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Test with Gradle Jacoco and Coveralls
        run: ./gradlew test jacocoTestReport coveralls --no-daemon

      - name: Coveralls GitHub Action
        continue-on-error: true  # coverage upload must not block the docker image build
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          format: jacoco


  docker-build:
    needs: [ build ]
    runs-on: ubuntu-latest

    steps:
      - name: Create more disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /opt/hostedtoolcache
      - uses: actions/checkout@v4
      - name: Build and push
        id: docker_build
        uses: mr-smithers-excellent/docker-build-push@v7
        with:
          dockerfile: Dockerfile
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          image: lfoppiano/grobid-superconductors
          registry: docker.io
          pushImage: ${{ github.event_name != 'pull_request' }}
          tags: ${{ github.event.inputs.custom_tag || 'latest-develop' }}
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
