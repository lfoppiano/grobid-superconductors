/*** Packaging and distribution ***/

shadowJar {
    archiveClassifier = "onejar"
    mergeServiceFiles()
    zip64 true
    manifest {
        attributes 'Main-Class': 'org.grobid.service.GrobidSuperconductorsApplication'
    }
    from sourceSets.main.output
    configurations = [project.configurations.runtimeClasspath]
}

jar {
    enabled true
}

artifacts {
    archives shadowJar
}

distZip.enabled = true
distTar.enabled = false
shadowDistZip.enabled = false
shadowDistTar.enabled = false

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}

def conf = new org.yaml.snakeyaml.Yaml().load(new File("resources/config/config.yml").newInputStream())
def grobidHome = conf.grobidHome.replace("\$", "").replace('{', "").replace("GROBID_HOME:- ", "").replace("}", "")
if (grobidHome.startsWith("../")) {
    grobidHome = "${rootProject.rootDir}/${grobidHome}"
}

/** Model management **/

task copyModels(type: Copy) {
    from "${rootDir}/resources/models"
    include "**/*.wapiti"
    include "**/*.wapiti.gz"
    include "**/config.json"
    include "**/transformer-config.json"
    include "**/transformer-tokenizer/**"
    include "**/model_weights.hdf5"
    include "**/preprocessor.json"
    exclude "**/features-engineering/**"
    exclude "**/result-logs/**"
    into "${grobidHome}/models/"

    doLast {
        print "Copy models under grobid-home: ${grobidHome}"
        ant.gunzip(src: "${grobidHome}/models/superconductors/model.wapiti.gz", dest: "${grobidHome}/models/superconductors/")
    }
}

// Gradle 9 removed the dynamic `exec {}` shortcut inside task actions, so we inject
// ExecOperations via a helper interface and call it from doLast. Native git (not grgit/JGit)
// clones the HuggingFace model repos: JGit's clone fails against HF with
// "TransportException: Short read of block".
interface InjectedExecOps {
    @Inject ExecOperations getExecOps()
}

task downloadQuantitiesModelsGit(dependsOn: copyModels) {
    def targetDir = file("${grobidHome}/models/data_models_quantities")
    def injected = objects.newInstance(InjectedExecOps)
    doLast {
        targetDir.parentFile.mkdirs()
        if (targetDir.exists()) {
            injected.execOps.exec {
                workingDir = targetDir
                commandLine 'git', 'pull'
            }
        } else {
            injected.execOps.exec {
                commandLine 'git', 'clone',
                    'https://huggingface.co/sciencialab/grobid-quantities-models',
                    targetDir.absolutePath
            }
        }
    }
}

task downloadSuperconductorsModelsGit(dependsOn: copyModels) {
    def targetDir = file("${grobidHome}/models/data_models_superconductors")
    def injected = objects.newInstance(InjectedExecOps)
    doLast {
        targetDir.parentFile.mkdirs()
        if (targetDir.exists()) {
            injected.execOps.exec {
                workingDir = targetDir
                commandLine 'git', 'pull'
            }
        } else {
            injected.execOps.exec {
                commandLine 'git', 'clone',
                    'https://huggingface.co/sciencialab/grobid-superconductors-models',
                    targetDir.absolutePath
            }
        }
    }
}

task installModels(dependsOn: [copyModels, downloadQuantitiesModelsGit, downloadSuperconductorsModelsGit]) {
    doLast {
        def sourceDir = file("${grobidHome}/models/data_models_quantities")
        def destDir = file("${grobidHome}/models/")

        Arrays.asList(
            "quantities",
            "quantities-BERT_CRF",
            "quantities-BidLSTM_CRF",
            "quantities-BidLSTM_CRF_FEATURES",
            "units-BERT_CRF",
            "units-BidLSTM_CRF",
            "units-BidLSTM_CRF_FEATURES",
            "units",
            "values-BERT_CRF",
            "values-BidLSTM_CRF",
            "values-BidLSTM_CRF_FEATURES",
            "values"
        ).each { String subDirName ->
            var subDir = new File(sourceDir, subDirName)
            if (subDir.isDirectory()) {
                copy {
                    from subDir
                    into new File(destDir, subDirName)
                }
            }
        }

        delete files("${sourceDir}")

        sourceDir = file("${grobidHome}/models/data_models_superconductors")

        Arrays.asList(
            "material-BERT_CRF",
            "superconductors-BERT_CRF",
            "superconductors-mattpuscibert-BERT_CRF"
        ).each { String subDirName ->
            var subDir = new File(sourceDir, subDirName)
            if (subDir.isDirectory()) {
                copy {
                    from subDir
                    into new File(destDir, subDirName)
                }
            }
        }
        delete files("${sourceDir}")
    }
}

wrapper {
    gradleVersion = "9.6.1"
}


jacocoTestReport {
    reports {
        xml.required = true // coveralls plugin depends on xml format report
        html.required = true
    }
    dependsOn test // tests are required to run before generating the report
}

coveralls {
    jacocoReportPath 'build/reports/jacoco/test/jacocoTestReport.xml'
}

release {
    failOnUnversionedFiles = false
    failOnCommitNeeded = false
    tagTemplate = 'v${version}'
    git {
        requireBranch.set('master')
    }
}
